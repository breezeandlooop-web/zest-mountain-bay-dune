<!doctype html>
  <html><head><style>
    body { margin:0; background:#ddd; font-family:sans-serif; }
    .row { display:flex; gap:24px; padding:24px; align-items:flex-end; flex-wrap:wrap; }
    .cell { background:#F4EFE6; padding:16px; }
    .navy { background:#1A2744; padding:16px; }
    h2 { margin:8px 16px 0; font-size:14px; }
  </style></head>
  <body>
    <h2>Card bird on ivory</h2>
    <div class="row">
      <div class="cell"><img src="hummingbird.svg" width="480"></div>
      <div class="cell"><img src="hummingbird.svg" width="240"></div>
      <div class="cell"><img src="hummingbird.svg" width="120"></div>
    </div>
    <h2>Favicon at 256 / 64 / 32 / 16</h2>
    <div class="row">
      <img src="favicon-src.svg" width="256" height="256">
      <img src="favicon-src.svg" width="64" height="64">
      <img src="favicon-src.svg" width="32" height="32">
      <img src="favicon-src.svg" width="16" height="16">
    </div>
  </body></html>
